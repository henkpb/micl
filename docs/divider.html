<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Demonstrating MICL Dividers">
    <title>MICL Dividers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&icon_names=check,content_copy,dark_mode,home&display=block">
    <link rel="stylesheet" href="themes/airblue/theme.css" id="theme-link">
    <link rel="stylesheet" href="micl.css">
    <link rel="stylesheet" href="docs.css">
    <style>
        .docs-example {
            gap: 0;
        }
        p {
            color: var(--md-sys-color-on-surface);
        }
        section:first-child .micl-pane__column > :last-child {
            padding-block-end: 0;
        }
        section:first-child .micl-card__content {
            padding: 0;
        }
        section:first-child .micl-card-filled {
            --md-comp-divider-color: var(--md-sys-color-primary);
        }
        p.md-sys-typescale-label-large {
            margin: 2rem 2rem 1rem;
        }
        .verticalbox {
            display: flex;
            flex-wrap: nowrap;
        }
    </style>
</head>
<body class="micl-window light">
    <main class="micl-panes micl-panes--stacked-to-large">
        <section class="micl-pane">
            <header class="micl-appbar">
                <a href="index.html" class="micl-appbar__leading-icon micl-iconbutton-standard-s docs-link" aria-label="Navigate to the main MICL Showcase page">
                    <span class="material-symbols-outlined" aria-hidden="true">home</span>
                </a>
                <div class="micl-appbar__headline micl-appbar__headline--center">
                    <h1>Dividers</h1>
                    <p class="micl-appbar__subtitle">Showcasing MICL dividers</p>
                </div>
                <div id="settings-placeholder" class="micl-appbar__trailing"></div>
            </header>

            <div class="micl-pane__columns micl-pane__columns--stacked-to-expanded">
                <div class="micl-pane__column">
                    <div class="micl-card-elevated">
                        <div class="micl-card__content">
                            <div class="docs-example">
                                <template>
                                    <p class="md-sys-typescale-label-large">Full width:</p>
                                    <hr class="micl-divider">
                                    <p class="md-sys-typescale-label-large">Inset:</p>
                                    <hr class="micl-divider-inset">
                                    <p class="md-sys-typescale-label-large">Inset start:</p>
                                    <hr class="micl-divider-inset-start">
                                    <p class="md-sys-typescale-label-large">Inset end:</p>
                                    <hr class="micl-divider-inset-end">
                                    <p class="md-sys-typescale-label-large">(end)</p>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="micl-card-elevated">
                        <div class="micl-card__content">
                            <div class="docs-example">
                                <template>
                                    <div class="verticalbox">
                                        <p class="md-sys-typescale-label-large">Full height:</p>
                                        <hr class="micl-divider-vertical">
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="micl-pane__column">
                    <div class="micl-card-filled">
                        <div class="micl-card__content">
                            <div class="docs-example">
                                <template>
                                    <p class="md-sys-typescale-label-large">Full width:</p>
                                    <hr class="micl-divider">
                                    <p class="md-sys-typescale-label-large">Inset:</p>
                                    <hr class="micl-divider-inset">
                                    <p class="md-sys-typescale-label-large">Inset start:</p>
                                    <hr class="micl-divider-inset-start">
                                    <p class="md-sys-typescale-label-large">Inset end:</p>
                                    <hr class="micl-divider-inset-end">
                                    <p class="md-sys-typescale-label-large">(end)</p>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="micl-card-filled">
                        <div class="micl-card__content">
                            <div class="docs-example">
                                <template>
                                    <div class="verticalbox">
                                        <p class="md-sys-typescale-label-large">Full height:</p>
                                        <hr class="micl-divider-vertical">
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="micl-pane__column">
                    <div class="micl-card-outlined">
                        <div class="micl-card__content">
                            <div class="docs-example">
                                <template>
                                    <p class="md-sys-typescale-label-large">Full width:</p>
                                    <hr class="micl-divider">
                                    <p class="md-sys-typescale-label-large">Inset:</p>
                                    <hr class="micl-divider-inset">
                                    <p class="md-sys-typescale-label-large">Inset start:</p>
                                    <hr class="micl-divider-inset-start">
                                    <p class="md-sys-typescale-label-large">Inset end:</p>
                                    <hr class="micl-divider-inset-end">
                                    <p class="md-sys-typescale-label-large">(end)</p>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="micl-card-outlined">
                        <div class="micl-card__content">
                            <div class="docs-example">
                                <template>
                                    <div class="verticalbox">
                                        <p class="md-sys-typescale-label-large">Full height:</p>
                                        <hr class="micl-divider-vertical">
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="micl.js"></script>
    <script src="docs.js"></script>
</body>
</html>
