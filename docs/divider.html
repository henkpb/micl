<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Demonstrating MICL Dividers">
    <title>MICL Dividers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&icon_names=check,close,content_copy,dark_mode,home,palette&display=block">
    <link rel="stylesheet" href="themes/airblue/theme.css" id="theme-link">
    <link rel="stylesheet" href="micl.css">
    <link rel="stylesheet" href="shapes.css">
    <link rel="stylesheet" href="docs.css">
    <style>
        .docs-example {
            border: 3px solid var(--md-sys-color-primary-container)
        }
        p {
            color: var(--md-sys-color-on-surface);
        }
        p.md-sys-typescale-label-large {
            margin: 2rem 2rem 1rem;
        }
        .verticalbox {
            display: flex;
            flex-wrap: nowrap;
            block-size: 320px;
        }
    </style>
</head>
<body class="micl-window light">
    <div class="docs-shell">
        <header class="docs-top">
            <a href="index.html" class="micl-iconbutton-standard-s docs-link" aria-label="Back to the MICL Showcase">
                <span class="material-symbols-outlined" aria-hidden="true">home</span>
            </a>
            <div class="docs-top__crumbs"><span>MICL</span><span aria-hidden="true">/</span><span>Components</span><span aria-hidden="true">/</span><strong>Dividers</strong></div>
            <div id="settings-placeholder" class="docs-top__actions"></div>
        </header>

        <section class="docs-hero">
            <svg class="micl-shapes micl-shapes--sunny docs-hero__sunny" viewBox="-10 0 120 100" aria-hidden="true"><path /></svg>
            <svg class="micl-shapes micl-shapes--clover-4 docs-hero__clover" viewBox="-10 0 120 100" aria-hidden="true"><path /></svg>
            <p class="docs-hero__eyebrow">Component</p>
            <h1>Dividers</h1>
            <p class="docs-hero__lede">Dividers are thin lines that separate content into distinct sections.</p>
            <ul class="docs-hero__facts">
                <li>Horizontal & vertical</li>
                <li>Inset variants</li>
                <li>RTL ready</li>
            </ul>
            <div class="docs-hero__demo">
                <div style="inline-size:250px">
                    <p class="md-sys-typescale-label-large" style="margin:4px 0">Full width</p>
                    <hr class="micl-divider">
                    <p class="md-sys-typescale-label-large" style="margin:4px 0">Inset</p>
                    <hr class="micl-divider-inset">
                </div>
            </div>
        </section>


        <main class="docs-content docs-content--columns">
            <div class="docs-stage">
                <div class="docs-example">
                    <template>
                        <p class="md-sys-typescale-label-large">Full width:</p>
                        <hr class="micl-divider">
                        <p class="md-sys-typescale-label-large">Inset:</p>
                        <hr class="micl-divider-inset">
                        <p class="md-sys-typescale-label-large">Inset start:</p>
                        <hr class="micl-divider-inset-start">
                        <p class="md-sys-typescale-label-large">Inset end:</p>
                        <hr class="micl-divider-inset-end">
                        <p class="md-sys-typescale-label-large">(end)</p>
                    </template>
                </div>
            </div>

            <div class="docs-stage">
                <div class="docs-example">
                    <template>
                        <div class="verticalbox">
                            <p class="md-sys-typescale-label-large">Full height:</p>
                            <hr class="micl-divider-vertical">
                        </div>
                    </template>
                </div>
            </div>
        </main>

        <footer class="docs-foot">MICL — Material-Inspired Component Library</footer>
    </div>

    <script src="micl.js"></script>
    <script src="docs.js"></script>
</body>
</html>
