<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Demonstrating MICL Radio Buttons">
    <title>MICL Radio Buttons</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&icon_names=check,close,content_copy,dark_mode,home,palette&display=block">
    <link rel="stylesheet" href="themes/airblue/theme.css" id="theme-link">
    <link rel="stylesheet" href="micl.css">
    <link rel="stylesheet" href="shapes.css">
    <link rel="stylesheet" href="docs.css">
    <style>
        .docs-example {
            gap: 0;
        }
    </style>
</head>
<body class="micl-window light">
    <div class="docs-shell">
        <header class="docs-top">
            <a href="index.html" class="micl-iconbutton-standard-s docs-link" aria-label="Back to the MICL Showcase">
                <span class="material-symbols-outlined" aria-hidden="true">home</span>
            </a>
            <div class="docs-top__crumbs"><span>MICL</span><span aria-hidden="true">/</span><span>Components</span><span aria-hidden="true">/</span><strong>Radio buttons</strong></div>
            <div id="settings-placeholder" class="docs-top__actions"></div>
        </header>

        <section class="docs-hero">
            <svg class="micl-shapes micl-shapes--sunny docs-hero__sunny" viewBox="-10 0 120 100" aria-hidden="true"><path /></svg>
            <svg class="micl-shapes micl-shapes--clover-4 docs-hero__clover" viewBox="-10 0 120 100" aria-hidden="true"><path /></svg>
            <p class="docs-hero__eyebrow">Component</p>
            <h1>Radio buttons</h1>
            <p class="docs-hero__lede">A radio button allows a user to select only one option from a group of mutually exclusive choices.</p>
            <ul class="docs-hero__facts">
                <li>Group keyboard navigation</li>
                <li>RTL ready</li>
            </ul>
            <div class="docs-hero__demo">
                <div>
                    <div class="docs-flex--vcenter"><input type="radio" id="herora1" name="herora" class="micl-radio" checked><label for="herora1" class="md-sys-typescale-body-medium">This one</label></div>
                    <div class="docs-flex--vcenter"><input type="radio" id="herora2" name="herora" class="micl-radio"><label for="herora2" class="md-sys-typescale-body-medium">Or this one</label></div>
                </div>
            </div>
        </section>

        <main class="docs-content docs-content--columns">
            <div class="docs-stage">
                <div class="docs-example">
                    <template>
                        <div class="docs-flex--vcenter">
                            <input type="radio" class="micl-radio" id="myradio1" name="choices" checked value="c1">
                            <label for="myradio1" class="md-sys-typescale-body-medium">First Choice</label>
                        </div>
                        <div class="docs-flex--vcenter">
                            <input type="radio" class="micl-radio" id="myradio2" name="choices" value="c2">
                            <label for="myradio2" class="md-sys-typescale-body-medium">Second Choice</label>
                        </div>
                        <div class="docs-flex--vcenter">
                            <input type="radio" class="micl-radio" id="myradio3" name="choices" value="c3">
                            <label for="myradio3" class="md-sys-typescale-body-medium">Third Choice</label>
                        </div>
                        <div class="docs-flex--vcenter">
                            <input type="radio" class="micl-radio" id="myradio4" name="choices" value="c4" disabled>
                            <label for="myradio4" class="md-sys-typescale-body-medium">Fourth Choice (disabled)</label>
                        </div>
                    </template>
                </div>
            </div>

            <div class="docs-stage">
                <div class="docs-example">
                    <template>
                        <div class="docs-flex--vcenter" style="justify-content:flex-end">
                            <label for="myradio21" class="md-sys-typescale-body-medium">First Choice</label>
                            <input type="radio" class="micl-radio" id="myradio21" name="selection" checked value="c1">
                        </div>
                        <div class="docs-flex--vcenter" style="justify-content:flex-end">
                            <label for="myradio22" class="md-sys-typescale-body-medium">Second Choice</label>
                            <input type="radio" class="micl-radio" id="myradio22" name="selection" value="c2">
                        </div>
                        <div class="docs-flex--vcenter" style="justify-content:flex-end">
                            <label for="myradio23" class="md-sys-typescale-body-medium">Third Choice</label>
                            <input type="radio" class="micl-radio" id="myradio23" name="selection" value="c3">
                        </div>
                        <div class="docs-flex--vcenter" style="justify-content:flex-end">
                            <label for="myradio24" class="md-sys-typescale-body-medium">Fourth Choice (disabled)</label>
                            <input type="radio" class="micl-radio" id="myradio24" name="selection" value="c4" disabled>
                        </div>
                    </template>
                </div>
            </div>
        </main>

        <footer class="docs-foot">MICL — Material-Inspired Component Library</footer>
    </div>

    <script src="micl.js"></script>
    <script src="docs.js"></script>
</body>
</html>
