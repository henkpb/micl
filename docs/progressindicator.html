<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Demonstrating MICL Progress Indicators">
    <title>MICL Progress Indicators</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&icon_names=check,content_copy,dark_mode,home&display=block">
    <link rel="stylesheet" href="themes/airblue/theme.css" id="theme-link">
    <link rel="stylesheet" href="micl.css">
    <link rel="stylesheet" href="docs.css">
    <style>
        .docs-example {
            gap: 12px;
        }
        .micl-card__content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        label {
            display: inline-block;
            min-inline-size: 148px;
            color: var(--md-sys-color-on-surface);
        }
    </style>
</head>
<body class="micl-window light">
    <main class="micl-panes micl-panes--stacked-to-large">
        <section class="micl-pane">
            <header class="micl-appbar">
                <a href="index.html" class="micl-appbar__leading-icon micl-iconbutton-standard-s docs-link" aria-label="Navigate to the main MICL Showcase page">
                    <span class="material-symbols-outlined" aria-hidden="true">home</span>
                </a>
                <div class="micl-appbar__headline micl-appbar__headline--center">
                    <h1>Progress Indicators</h1>
                    <p class="micl-appbar__subtitle">Showcasing MICL progress indicators</p>
                </div>
                <div id="settings-placeholder" class="micl-appbar__trailing"></div>
            </header>

            <div class="micl-pane__columns micl-pane__columns--stacked-to-expanded">
                <div class="micl-pane__column"></div>
                <div class="micl-pane__column">
                    <div class="micl-card-elevated">
                        <div class="micl-card__headline-s">
                            <h2>Linear</h2>
                        </div>
                        <div class="micl-card__content">
                            <div class="docs-example">
                                <template>
                                    <div>
                                        <label for="linear1" class="md-sys-typescale-body-medium">Downloading&hellip; 0%</label>
                                        <progress id="linear1" class="micl-linear-progress" value="0"></progress>
                                    </div>
                                </template>
                            </div>
                            <div class="docs-example">
                                <template>
                                    <div>
                                        <label for="linear2" class="md-sys-typescale-body-medium">Downloading&hellip; 63%</label>
                                        <progress id="linear2" class="micl-linear-progress" value="0.63"></progress>
                                    </div>
                                </template>
                            </div>
                            <div class="docs-example docs-animate">
                                <template>
                                    <div>
                                        <label for="linear3" class="md-sys-typescale-body-medium">Downloading&hellip;</label>
                                        <progress id="linear3" class="micl-linear-progress" value="0"></progress>
                                    </div>
                                </template>
                            </div>
                            <div class="docs-example">
                                <template>
                                    <div>
                                        <label for="linear4" class="md-sys-typescale-body-medium">Indeterminate</label>
                                        <progress id="linear4" class="micl-linear-progress"></progress>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="micl-card-elevated">
                        <div class="micl-card__headline-s">
                            <h2>Circular</h2>
                        </div>
                        <div class="micl-card__content">
                            <div class="docs-example">
                                <template>
                                    <div>
                                        <label for="circular1" class="md-sys-typescale-body-medium">Downloading&hellip; 0%</label>
                                        <progress id="circular1" class="micl-circular-progress" value="0"></progress>
                                    </div>
                                </template>
                            </div>
                            <div class="docs-example">
                                <template>
                                    <div>
                                        <label for="circular2" class="md-sys-typescale-body-medium">Downloading&hellip; 63%</label>
                                        <progress id="circular2" class="micl-circular-progress" value="0.63"></progress>
                                    </div>
                                </template>
                            </div>
                            <div class="docs-example docs-animate">
                                <template>
                                    <div>
                                        <label for="circular3" class="md-sys-typescale-body-medium">Downloading&hellip;</label>
                                        <progress id="circular3" class="micl-circular-progress" value="0"></progress>
                                    </div>
                                </template>
                            </div>
                            <div class="docs-example">
                                <template>
                                    <div>
                                        <label for="circular4" class="md-sys-typescale-body-medium">Indeterminate</label>
                                        <progress id="circular4" class="micl-circular-progress"></progress>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="micl-pane__column">
                    <div class="micl-card-elevated">
                        <div class="micl-card__headline-s">
                            <h2>Linear</h2>
                        </div>
                        <div class="micl-card__content">
                            <div class="docs-example">
                                <template>
                                    <label for="linear5" class="md-sys-typescale-body-medium">Downloading&hellip; 0%</label>
                                    <div role="progressbar" id="linear5" class="micl-linear-progress" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0">
                                        <div class="micl-linear-progress__wave" aria-hidden="true"></div>
                                    </div>
                                </template>
                            </div>
                            <div class="docs-example">
                                <template>
                                    <label for="linear6" class="md-sys-typescale-body-medium">Downloading&hellip;63%</label>
                                    <div role="progressbar" id="linear6" class="micl-linear-progress" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.63">
                                        <div class="micl-linear-progress__wave" aria-hidden="true"></div>
                                    </div>
                                </template>
                            </div>
                            <div class="docs-example docs-animate">
                                <template>
                                    <label for="linear7" class="md-sys-typescale-body-medium">Downloading&hellip;</label>
                                    <div role="progressbar" id="linear7" class="micl-linear-progress" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0">
                                        <div class="micl-linear-progress__wave" aria-hidden="true"></div>
                                    </div>
                                </template>
                            </div>
                            <div class="docs-example">
                                <template>
                                    <label for="linear8" class="md-sys-typescale-body-medium">Indeterminate</label>
                                    <div role="progressbar" id="linear8" class="micl-linear-progress micl-linear-progress--indeterminate">
                                        <div class="micl-linear-progress__wave" aria-hidden="true"></div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="micl-pane__column"></div>
            </div>
        </section>
    </main>

    <script src="docs.js"></script>
    <script src="micl.js"></script>
    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const animate = () => {
            document.querySelectorAll('.docs-animate .micl-linear-progress,.docs-animate .micl-circular-progress').forEach(async (el) => {
                let attribute = el instanceof HTMLProgressElement ? 'value' : 'aria-valuenow';
                for (;;) {
                    for (let v = 0; v < 1;) {
                        v = Math.min(1, +(v + 0.01 + Math.random() * 0.3).toFixed(1));
                        el.setAttribute(attribute, v);
                        await sleep(500);
                    }
                    await sleep(2000);
                    el.setAttribute(attribute, 0);
                    await sleep(1500);
                }
            });
        };
        if (document.readyState !== 'loading') {
            animate();
        }
        else {
            document.addEventListener('DOMContentLoaded', animate);
        }
    </script>
</body>
</html>
