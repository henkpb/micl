<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Demonstrating MICL Text fields">
    <title>MICL Text fields</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&icon_names=cancel,check,close,content_copy,credit_card,dark_mode,error,home,palette,search&display=block">
    <link rel="stylesheet" href="themes/airblue/theme.css" id="theme-link">
    <link rel="stylesheet" href="micl.css">
    <link rel="stylesheet" href="shapes.css">
    <link rel="stylesheet" href="docs.css">
</head>
<body class="micl-window light">
    <div class="docs-shell">
        <header class="docs-top">
            <a href="index.html" class="micl-iconbutton-standard-s docs-link" aria-label="Back to the MICL Showcase">
                <span class="material-symbols-outlined" aria-hidden="true">home</span>
            </a>
            <div class="docs-top__crumbs"><a href="index.html">MICL</a><span aria-hidden="true">/</span><a href="index.html#components">Components</a><span aria-hidden="true">/</span><strong>Text fields</strong></div>
            <div id="settings-placeholder" class="docs-top__actions"></div>
        </header>

        <main>

        <section class="docs-hero">
            <svg class="micl-shapes docs-hero__shape docs-hero__shape--corner" viewBox="0 0 100 100" aria-hidden="true"><path /></svg>
            <svg class="micl-shapes docs-hero__shape docs-hero__shape--edge" viewBox="0 0 100 100" aria-hidden="true"><path /></svg>
            <p class="docs-hero__eyebrow">Component</p>
            <h1>Text fields</h1>
            <p class="docs-hero__lede">Text fields let users enter text into a UI — filled or outlined, with labels, icons, prefixes, and supporting text.</p>
            <ul class="docs-hero__facts">
                <li>Filled & outlined</li>
                <li>Prefix, suffix & icons</li>
                <li>Character counter</li>
            </ul>
            <div class="docs-hero__demo">
                <div class="micl-textfield-outlined">
                    <label for="herotext">Label text</label>
                    <input type="text" id="herotext" value="Hello">
                </div>
            </div>
        </section>

        <div class="docs-content docs-content--columns">
            <div class="docs-stage micl-grid-field">
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <label for="mytextfield1">Label text</label>
                            <input type="text" id="mytextfield1">
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <span class="micl-textfield__icon-leading material-symbols-outlined" aria-hidden="true">search</span>
                            <label for="mytextfield2">Name</label>
                            <input type="text" id="mytextfield2" value="Marie Curie">
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <span class="micl-textfield__icon-leading material-symbols-outlined" aria-hidden="true">search</span>
                            <label for="mytextfield3">Label text</label>
                            <input type="text" id="mytextfield3">
                            <span class="micl-textfield__icon-trailing material-symbols-outlined" aria-hidden="true">cancel</span>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <span class="micl-textfield__icon-leading material-symbols-outlined" aria-hidden="true">search</span>
                            <label for="mytextfield4">City</label>
                            <input type="text" id="mytextfield4" disabled value="Paris">
                            <span class="micl-textfield__icon-trailing material-symbols-outlined" aria-hidden="true">cancel</span>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <label for="mytextfield5">Multiline text field</label>
                            <textarea id="mytextfield5"></textarea>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <span class="micl-textfield__icon-leading material-symbols-outlined" aria-hidden="true">search</span>
                            <label for="mytextfield6">Label text</label>
                            <input type="text" id="mytextfield6" aria-invalid="true">
                            <span class="micl-textfield__icon-trailing material-symbols-outlined" aria-hidden="true">cancel</span>
                        </div>
                    </template>
                </div>
            </div>

            <div class="docs-stage micl-grid-field">
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <input type="text" name="myname" aria-label="Name" placeholder="Name">
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <span class="micl-textfield__icon-leading material-symbols-outlined" aria-hidden="true">search</span>
                            <label for="mytextfield12">Text field</label>
                            <input type="text" id="mytextfield12" value="Outlined" aria-describedby="mytextfield12-support">
                            <span id="mytextfield12-support" class="micl-textfield__supporting-text">Supporting text</span>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <span id="mytextfield13-prefix" class="micl-textfield__prefix">€</span>
                            <label for="mytextfield13">Amount</label>
                            <input type="text" id="mytextfield13" value="299.89" aria-describedby="mytextfield13-prefix">
                            <span class="micl-textfield__icon-trailing material-symbols-outlined" aria-hidden="true">credit_card</span>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <span class="micl-textfield__icon-leading material-symbols-outlined" aria-hidden="true">search</span>
                            <label for="mytextfield14">City</label>
                            <input type="text" id="mytextfield14" disabled value="Paris" aria-describedby="mytextfield14-support">
                            <span class="micl-textfield__icon-trailing material-symbols-outlined" aria-hidden="true">cancel</span>
                            <span id="mytextfield14-support" class="micl-textfield__supporting-text">This input field is disabled</span>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <label for="mytextfield15">Text area</label>
                            <textarea id="mytextfield15" rows="3">Text areas are taller than text fields and wrap overflow text onto a new line. They are a fixed height and scroll vertically when the cursor reaches the bottom of the field. </textarea>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <span class="micl-textfield__icon-leading material-symbols-outlined" aria-hidden="true">search</span>
                            <label for="mytextfield16">Label text</label>
                            <input type="text" id="mytextfield16" aria-invalid="true">
                            <span class="micl-textfield__icon-trailing material-symbols-outlined" aria-hidden="true">cancel</span>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-outlined">
                            <label for="mytextfield17">Weight</label>
                            <input type="number" id="mytextfield17" value="17800" aria-invalid="true" aria-describedby="mytextfield17-suffix mytextfield17-support">
                            <span id="mytextfield17-suffix" class="micl-textfield__suffix">kg</span>
                            <span class="micl-textfield__icon-trailing material-symbols-outlined" style="font-variation-settings:'FILL' 1" aria-hidden="true">error</span>
                            <span id="mytextfield17-support" class="micl-textfield__supporting-text">Too heavy</span>
                        </div>
                    </template>
                </div>
            </div>

            <div class="docs-stage micl-grid-field">
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-filled">
                            <label for="mytextfield21">Timestamp</label>
                            <input type="datetime-local" id="mytextfield21">
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-filled" style="--md-comp-text-field-prefix-space:2.5em">
                            <span class="micl-textfield__icon-leading material-symbols-outlined" aria-hidden="true">search</span>
                            <span class="micl-textfield__prefix">NOK</span>
                            <label for="mytextfield22">Amount<span aria-hidden="true">*</span></label>
                            <input type="text" id="mytextfield22" required value="" aria-describedby="mytextfield22-support">
                            <span id="mytextfield22-support" class="micl-textfield__supporting-text">In Norwegian kroner</span>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-filled">
                            <span id="mytextfield23-counter" class="micl-textfield__character-counter"></span>
                            <span id="mytextfield23-support" class="micl-textfield__supporting-text micl-textfield__supporting-text--focus">Enter at least twelve characters</span>
                            <span id="mytextfield23-prefix" class="micl-textfield__prefix">€</span>
                            <span class="micl-textfield__icon-trailing material-symbols-outlined" aria-hidden="true">cancel</span>
                            <input type="text" id="mytextfield23" maxlength="24" aria-describedby="mytextfield23-prefix mytextfield23-support mytextfield23-counter">
                            <label for="mytextfield23">Label text</label>
                            <span class="micl-textfield__icon-leading material-symbols-outlined" aria-hidden="true">search</span>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-filled">
                            <span class="micl-textfield__icon-leading material-symbols-outlined" aria-hidden="true">search</span>
                            <label for="mytextfield24">City</label>
                            <input type="text" id="mytextfield24" disabled value="Paris" aria-describedby="mytextfield24-support">
                            <span class="micl-textfield__icon-trailing material-symbols-outlined" aria-hidden="true">cancel</span>
                            <span id="mytextfield24-support" class="micl-textfield__supporting-text">This input field is disabled</span>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-filled">
                            <label for="mytextfield25">Multiline text field</label>
                            <textarea id="mytextfield25" maxlength="100" aria-describedby="mytextfield25-counter">Lorem ipsum dolor sit amet consectetur adipiscing elit</textarea>
                            <span id="mytextfield25-counter" class="micl-textfield__character-counter"></span>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-filled">
                            <span class="micl-textfield__icon-leading material-symbols-outlined" aria-hidden="true">search</span>
                            <label for="mytextfield26">Label text</label>
                            <input type="text" id="mytextfield26" aria-invalid="true">
                            <span class="micl-textfield__icon-trailing material-symbols-outlined" style="font-variation-settings:'FILL' 1" aria-hidden="true">error</span>
                        </div>
                    </template>
                </div>
                <div class="docs-example">
                    <template>
                        <div class="micl-textfield-filled">
                            <span class="micl-textfield__icon-leading material-symbols-outlined" aria-hidden="true">search</span>
                            <label for="mytextfield27">City</label>
                            <input type="text" id="mytextfield27" maxlength="20" value="Amsterdaaam" aria-invalid="true" aria-describedby="mytextfield27-support mytextfield27-counter">
                            <span class="micl-textfield__icon-trailing material-symbols-outlined" style="font-variation-settings:'FILL' 1" aria-hidden="true">error</span>
                            <span id="mytextfield27-support" class="micl-textfield__supporting-text">Incorrect spelling</span>
                            <span id="mytextfield27-counter" class="micl-textfield__character-counter"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        </main>

        <footer class="docs-foot">MICL — Material-Inspired Component Library</footer>
    </div>

    <script src="micl.js"></script>
    <script src="docs.js"></script>
</body>
</html>
